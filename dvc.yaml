# DVC tracks FILE artifacts (the Parquet lake, ML models) and the reproducible
# transforms that produce them. It deliberately does NOT model operational steps
# whose effects live in external systems DVC can't hash — the cold-start
# migration (writes the OLTP DB), document ingestion (S3 + OLTP), and live writes.
# Those are run as jobs/CLIs (e.g. `bash scripts/migrate.sh`,
# `janasunani-ingest-documents`); their results reach the lake via `materialize`.

stages:
  materialize:
    desc: >-
      Export the OLTP store to the Parquet lake (data/interim/) for analytics, ML,
      and the demo's history browse. DuckDB reads the OLTP DB via its
      sqlite/postgres scanner — engine-agnostic (uses OLTP_DB_URL). The OLTP DB is
      a plain input here, produced operationally by scripts/migrate.sh.
    cmd: uv run janasunani-materialize
    deps:
      - data/oltp/janasunani.db
      - janasunani/olap/materialize.py
    outs:
      - data/interim/complaints.parquet
      - data/interim/action_history.parquet
