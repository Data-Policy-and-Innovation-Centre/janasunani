# DVC tracks FILE artifacts (the Parquet lake, ML models) and the reproducible
# transforms that produce them. It deliberately does NOT model operational steps
# whose effects live in external systems DVC can't hash — the cold-start
# migration (writes the OLTP DB), document ingestion (S3 + OLTP), and live writes.
# Those are run as jobs/CLIs (e.g. `bash scripts/migrate.sh`,
# `janasunani-ingest-documents`); their results reach the lake via `materialize`.
#
# NOTE: the `materialize` stage deps on the local SQLite OLTP file, so `dvc repro`
# only applies to the SQLite dev setup. When OLTP is Postgres (cloud), run
# `janasunani-materialize` directly, then `dvc commit` the Parquet outs.

stages:
  # Reproducible CPU-only pipeline run over the DVC-tracked document sample:
  # file deps in, one SQLite artifact out — this DOES fit the DVC model. The
  # full-corpus backfill does NOT (operational S3 input, resumable GPU job,
  # per-stage env conflicts) and runs as a job; its outputs reach the lake
  # via the OLTP exporter + materialize.
  pipeline-sample:
    desc: >-
      Format classification, pytesseract OCR, and Presidio PII redaction over
      data/raw/documents-sample -> a versioned pipeline SQLite artifact.
      Runs sequentially in the pipeline-core and PII environments; needs the
      tesseract binary (+ tesseract-lang for Odia).
    cmd: >-
      uv run --extra pipeline-core janasunani-pipeline run
      --input data/raw/documents-sample
      --db data/processed/pipeline-sample.sqlite
      --models models
      --ocr-engine pytesseract
      --stages format_classifier ocr_extraction
      --workers 1 &&
      uv run --extra pii janasunani-pipeline run
      --input data/raw/documents-sample
      --db data/processed/pipeline-sample.sqlite
      --models models
      --stages pii_tagger
      --workers 1
    # File-level deps, not the whole `janasunani/pipeline` tree (#87). The
    # directory hash changed on every merge into that package -- dedup, the
    # exporter, the evaluator, the grievance redactor -- none of which this
    # stage runs, so the cached artifact read as stale when it was fine, and
    # nothing distinguished that from genuinely stale. CI only runs `dvc dag`,
    # which validates structure and never compares anything.
    #
    # Listed here: the entrypoint and its plumbing, plus exactly the three
    # stages named across the invocations above. Adding a stage means
    # adding it here, which is the point -- the dep list and the command
    # should disagree loudly rather than silently.
    #
    # cli.py knows about the later page-type, summarizer, and categorizer stages,
    # but they are deliberately not deps: this regression stage stops after PII.
    deps:
      - data/raw/documents-sample
      - models/format_classifier/page_split_v3.0_doc_split.pkl
      - janasunani/pipeline/cli.py
      - janasunani/pipeline/pipeline.py
      - janasunani/pipeline/config.py
      - janasunani/pipeline/db.py
      - janasunani/pipeline/ticket.py
      - janasunani/pipeline/stages/format_classifier
      - janasunani/pipeline/stages/ocr_extraction
      - janasunani/pipeline/stages/pii_tagger.py
    outs:
      - data/processed/pipeline-sample.sqlite

  materialize:
    desc: >-
      Export the OLTP store to the Parquet lake (data/interim/) for analytics, ML,
      and the demo's history browse. DuckDB reads the OLTP DB via its
      sqlite/postgres scanner — engine-agnostic (uses OLTP_DB_URL). The OLTP DB is
      a plain input here, produced operationally by scripts/migrate.sh.
    cmd: uv run janasunani-materialize
    deps:
      - data/oltp/janasunani.db
      - janasunani/olap/materialize.py
    outs:
      - data/interim/complaints.parquet
      - data/interim/action_history.parquet
      - data/interim/pages.parquet
      - data/interim/documents.parquet

  findings:
    desc: >-
      Build the five aggregate-only Sprint 3 findings from the two authorized
      lake tables. Each entrypoint opens only its declared table set; no stage
      reads complaints.grievance or enumerates other data/interim artifacts.
    cmd: >-
      uv run --frozen janasunani-closure-headline &&
      uv run --frozen janasunani-two-day-bare-closures &&
      uv run --frozen janasunani-discard-reasons &&
      uv run --frozen janasunani-confirmed-duplicates &&
      uv run --frozen janasunani-misrouting-baseline
    deps:
      - data/interim/complaints.parquet
      - data/interim/action_history.parquet
      - janasunani/analytics/findings/closure.py
      - janasunani/analytics/findings/discards.py
      - janasunani/analytics/marts.py
      - janasunani/analytics/sql/closure.sql
      - janasunani/olap/lake.py
      - scripts/analysis/closure_recording_no_action.py
      - scripts/analysis/two_day_bare_closures.py
      - scripts/analysis/discard_reason_families.py
      - scripts/analysis/confirmed_duplicates.py
      - scripts/analysis/misrouting_baseline.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/findings/closure_recording_no_action.csv
      - outputs/findings/closure_recording_no_action.md
      - outputs/findings/two_day_bare_closures.csv
      - outputs/findings/two_day_bare_closures.md
      - outputs/findings/discard_reason_families.csv
      - outputs/findings/discard_reason_families.md
      - outputs/findings/confirmed_duplicates.csv
      - outputs/findings/confirmed_duplicates.md
      - outputs/findings/misrouting_baseline.csv
      - outputs/findings/misrouting_baseline.md

  actionability-adjudication-prepare:
    desc: >-
      Reconcile the two directly tracked frontier judgments into confident
      consensus rows and a resolver queue. Inputs and outputs contain opaque
      item IDs only; no ticket numbers or unredacted grievance text are stored.
    cmd: >-
      uv run --frozen python scripts/reconcile_actionability_adjudication.py prepare
      --sample data/external/actionability_frontier_v1/sample.jsonl
      --judge-a data/external/actionability_frontier_v1/judge_a.jsonl
      --judge-b data/external/actionability_frontier_v1/judge_b.jsonl
      --consensus data/external/actionability_frontier_v1/consensus.jsonl
      --resolver-input data/external/actionability_frontier_v1/resolver_input.jsonl
      --report data/external/actionability_frontier_v1/adjudication_report.json
      --protocol-version frontier-actionability-adjudication-v1
      --inference-environment openai-codex-agent-contexts
      --egress-policy pii-redacted-shape-screened
    deps:
      - data/external/actionability_frontier_v1/sample.jsonl
      - data/external/actionability_frontier_v1/judge_a.jsonl
      - data/external/actionability_frontier_v1/judge_b.jsonl
      - janasunani/evaluation/adjudication.py
      - scripts/reconcile_actionability_adjudication.py
      - pyproject.toml
      - uv.lock
    outs:
      - data/external/actionability_frontier_v1/consensus.jsonl
      - data/external/actionability_frontier_v1/resolver_input.jsonl
      - data/external/actionability_frontier_v1/adjudication_report.json

  actionability-adjudication-finalize:
    desc: >-
      Deterministically combine the fixed sample, confident consensus and the
      directly tracked frontier resolver output into development gold. The
      result remains advisory evidence and is not a five-class release set.
    cmd: >-
      uv run --frozen python scripts/reconcile_actionability_adjudication.py finalize
      --sample data/external/actionability_frontier_v1/sample.jsonl
      --consensus data/external/actionability_frontier_v1/consensus.jsonl
      --resolver data/external/actionability_frontier_v1/resolver.jsonl
      --gold data/external/actionability_frontier_v1/gold.jsonl
      --manifest data/external/actionability_frontier_v1/gold.manifest.json
      --sample-manifest data/external/actionability_frontier_v1/sample.provenance.json
      --protocol-version frontier-actionability-adjudication-v1
      --inference-environment openai-codex-agent-contexts
      --egress-policy pii-redacted-shape-screened
    deps:
      - data/external/actionability_frontier_v1/sample.jsonl
      - data/external/actionability_frontier_v1/sample.provenance.json
      - data/external/actionability_frontier_v1/consensus.jsonl
      - data/external/actionability_frontier_v1/resolver.jsonl
      - janasunani/evaluation/adjudication.py
      - scripts/reconcile_actionability_adjudication.py
      - pyproject.toml
      - uv.lock
    outs:
      - data/external/actionability_frontier_v1/gold.jsonl
      - data/external/actionability_frontier_v1/gold.manifest.json

  actionability-local-candidate-benchmark:
    desc: >-
      Reproduce the high-catch local comparison between the TF-IDF review
      classifier and the frozen DVC-mirrored MuRIL encoder. MiniLM remains only
      in directly tracked historical evidence because its local HF cache was
      not a governed input.
    cmd: >-
      uv run --frozen --extra categorizer python
      scripts/benchmark_actionability_candidates.py
      --gold data/external/actionability_frontier_v1/gold.jsonl
      --output outputs/evaluation/actionability_candidates_muril_high_catch.json
      --artifact-dir models/actionability
      --multilingual-encoder muril_local=models/categorizer
      --min-review-precision 0.6
      --max-actionable-review-rate 0.1
      --overwrite
    deps:
      - data/external/actionability_frontier_v1/gold.jsonl
      - models/categorizer
      - janasunani/evaluation/actionability.py
      - janasunani/evaluation/classification.py
      - janasunani/evaluation/embedding_actionability.py
      - janasunani/evaluation/stats.py
      - scripts/benchmark_actionability_candidates.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/evaluation/actionability_candidates_muril_high_catch.json
      - models/actionability
  actionability-weak-label-audit:
    desc: >-
      Reproduce the aggregate administrative weak-label audit used to decide
      whether discard-family labels are safe enough for training. The stage
      reads only the two declared lake tables and publishes no grievance text
      or item-level rows.
    cmd: >-
      uv run --frozen janasunani-audit-actionability-labels
      --complaints data/interim/complaints.parquet
      --action-history data/interim/action_history.parquet
      --min-office-support 100
      --output outputs/evaluation/actionability_weak_label_audit.json
    deps:
      - data/interim/complaints.parquet
      - data/interim/action_history.parquet
      - janasunani/analytics/findings/discards.py
      - janasunani/evaluation/actionability.py
      - janasunani/evaluation/classification.py
      - janasunani/evaluation/weak_labels.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/evaluation/actionability_weak_label_audit.json

  categorization-historical-benchmark:
    desc: >-
      Train and evaluate the cheap local categorizer on a chronological,
      exact-text-group-disjoint, redacted-only Sambalpur 2024 manifest.
      Labels measure historical administrative agreement, not policy correctness.
    cmd: >-
      uv run --frozen --no-sync python -m janasunani.evaluation.categorization
      --dataset data/external/categorization_historical_v1/benchmark.jsonl
      --output outputs/evaluation/categorization_historical_v1.json
      --min-selective-accuracy 0.8
      --min-coverage 0.5
    deps:
      - data/external/categorization_historical_v1/benchmark.jsonl
      - data/external/categorization_historical_v1/benchmark.manifest.json
      - janasunani/evaluation/categorization.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/evaluation/categorization_historical_v1.json

  pii-development-scorecard:
    desc: >-
      Reproduce the current per-entity PII recall scorecard. The source has no
      reliable supported-language split or complete precision adjudication, so
      this remains development evidence rather than a release gate.
    cmd: >-
      uv run --frozen --extra pii python -m janasunani.evaluation.pii_scorecard
      --gold data/external/pii_gold_draft_n50.jsonl
      --out outputs/evaluation/pii_release.md
      --json-out outputs/evaluation/pii_release.json
    deps:
      - data/external/pii_gold_draft_n50.jsonl
      - janasunani/evaluation/pii_scorecard.py
      - janasunani/pipeline/pii_eval.py
      - janasunani/pipeline/stages/pii_tagger.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/evaluation/pii_release.json
      - outputs/evaluation/pii_release.md

  routing-historical-benchmark:
    desc: >-
      Reproduce chronological historical-destination agreement for all eligible
      structured grievances and the informative-category subset. This does not
      measure correct legal authority or outcome benefit.
    cmd: >-
      uv run --frozen janasunani-evaluate-routing
      --complaints data/interim/complaints.parquet
      --output outputs/evaluation/routing_historical_all.json
      && uv run --frozen janasunani-evaluate-routing
      --complaints data/interim/complaints.parquet
      --informative-categories-only
      --output outputs/evaluation/routing_historical_informative.json
    deps:
      - data/interim/complaints.parquet
      - janasunani/evaluation/classification.py
      - janasunani/evaluation/historical.py
      - janasunani/evaluation/routing.py
      - janasunani/evaluation/stats.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/evaluation/routing_historical_all.json
      - outputs/evaluation/routing_historical_informative.json

  full-benchmark-bundle:
    desc: >-
      Assemble available aggregate scorecards into one deterministic evidence
      bundle. Missing speed, accuracy, or impact evidence remains an explicit
      publication blocker; this stage never substitutes a descriptive proxy.
    cmd: >-
      uv run --frozen janasunani-build-benchmark-bundle
      --config config/benchmark_bundle.json
      --output outputs/benchmark/full_benchmark.json
      --markdown outputs/benchmark/full_benchmark.md
    deps:
      - config/benchmark_bundle.json
      - docs/evidence/sarvam_cached_benchmark.json
      - outputs/benchmark/latency.json
      - outputs/evaluation/actionability_candidates_muril_high_catch.json
      - outputs/evaluation/actionability_weak_label_audit.json
      - outputs/evaluation/pii_release.json
      - outputs/evaluation/routing_historical_all.json
      - outputs/evaluation/routing_historical_informative.json
      - janasunani/evaluation/benchmark_bundle.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/benchmark/full_benchmark.json
      - outputs/benchmark/full_benchmark.md

  benchmark-table:
    desc: >-
      Render the current DSI-reference comparison table from the same tracked
      latency and accuracy artifacts used by the full benchmark bundle.
      Missing measures remain explicitly not_measured.
    cmd: >-
      uv run --frozen janasunani-evaluate-benchmark
      --out outputs/benchmark
      --latency outputs/benchmark/latency.json
      --pii outputs/evaluation/pii_release.json
      --sarvam docs/evidence/sarvam_cached_benchmark.json
    deps:
      - outputs/benchmark/latency.json
      - outputs/evaluation/pii_release.json
      - docs/evidence/sarvam_cached_benchmark.json
      - janasunani/evaluation/benchmark_report.py
      - janasunani/evaluation/dsi_baselines.py
      - janasunani/evaluation/pricing.py
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/benchmark/table2.json
      - outputs/benchmark/table2.md
