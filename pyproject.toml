[project]
name = "janasunani"
version = "0.1.0"
description = "Odisha's new unified AI powered grievance redressal portal Janasunani 2.0 "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dpic",
    "dvc[s3]>=3.67.1",
    "loguru>=0.7.3",
    # polars is the dataframe library of choice; pandas is not a direct
    # dependency (it still arrives transitively via mlflow, pinned <3 there).
    # pyarrow is upper-bounded for mlflow compatibility (mlflow needs <24).
    "pandera>=0.31.1",
    "polars>=1.41.2",
    "pyarrow>=17,<24",
    # Database / migration / ingestion stack (migrated from grievance)
    # [asyncio] pulls greenlet, required by the async engine (not auto-installed
    # on macOS arm64).
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",          # engine-portable schema migrations for the OLTP store
    "aiosqlite>=0.21.0",      # async sqlite driver (local OLTP)
    "asyncpg>=0.30",          # async postgres driver (deploy OLTP)
    "psycopg2-binary>=2.9",   # sync postgres driver for alembic
    "pymysql>=1.1.1",
    "duckdb>=1.4.3",
    "boto3>=1.34",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "more-itertools>=10.7.0",
    "pytz>=2024.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "tqdm>=4.66",
    # Experiment tracking / model registry
    "mlflow>=2.18",
]

# Heavy per-stage ML dependencies for the document processing pipeline live in
# optional groups (extras) because DeepSeek OCR needs an older `transformers`
# than the rest — declared mutually exclusive via [tool.uv].conflicts below.
# Stages import lazily (see pipeline/pipeline.py), so an environment only
# installs the extra(s) for the stages it runs. Pins follow the DSI repo
# (numpy<2, opencv<4.12, transformers>=4.57,<5) and the DeepSeek-OCR model
# card (transformers 4.46 / tokenizers 0.20).
[project.optional-dependencies]
# format_classifier, pytesseract OCR, pii_tagger, page_type, summarizer
pipeline-core = [
    "huggingface-hub",
    "langdetect",
    "nltk",
    "numpy<2",
    "opencv-python<4.12",
    "pandas",
    "pdf2image",
    "pillow",
    "pytesseract",
    "pytorch-crf",
    "scikit-image",
    "scikit-learn>=1.8,<1.9",  # match the era of the pickled estimators (page_split pkl, label encoder)
    "torch",
    "transformers>=4.57,<5",
    "xgboost",
]
# DeepSeek OCR backend — GPU-only, conflicting transformers version
ocr-deepseek = [
    "addict",
    "easydict",
    "einops",
    "pdf2image",
    "pillow",
    "torch",
    "tokenizers==0.20.3",
    "transformers==4.46.3",
]
# MuRIL grievance categorizer
categorizer = [
    "huggingface-hub",
    "langdetect",
    "pandas",
    "scikit-learn>=1.8,<1.9",  # match the era of the pickled estimators (page_split pkl, label encoder)
    "torch",
    "transformers>=4.57,<5",
]

[project.scripts]
janasunani-migrate-mysql = "janasunani.migration.from_mysql:main"
janasunani-migrate-dump = "janasunani.migration.from_sql_dump:main"
janasunani-materialize = "janasunani.olap.materialize:main"
janasunani-ingest-documents = "janasunani.ingestion.document_ingestion:main"
janasunani-pipeline = "janasunani.pipeline.cli:main"
janasunani-export-pipeline = "janasunani.pipeline.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janasunani"]

[tool.uv]
# DeepSeek OCR pins an older transformers than every other stage; the extras
# can never be installed into the same environment. uv resolves them into
# disjoint lock forks; one Docker image per extra on deploy.
conflicts = [
    [{ extra = "ocr-deepseek" }, { extra = "pipeline-core" }],
    [{ extra = "ocr-deepseek" }, { extra = "categorizer" }],
]

[tool.uv.sources]
dpic = { git = "ssh://git@github.com/Data-Policy-and-Innovation-Centre/dpic-org.git", rev = "main" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "moto[s3]>=5.0",
    "nbstripout>=0.9.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
