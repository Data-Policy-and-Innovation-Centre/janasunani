[project]
name = "janasunani"
version = "0.1.0"
description = "Odisha's new unified AI powered grievance redressal portal Janasunani 2.0 "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dpic",
    "dvc[s3]>=3.67.1",
    "loguru>=0.7.3",
    # polars is the dataframe library of choice; pandas is not a direct
    # dependency (it still arrives transitively via mlflow, pinned <3 there).
    # pyarrow is upper-bounded for mlflow compatibility (mlflow needs <24).
    "pandera>=0.31.1",
    "polars>=1.41.2",
    "pyarrow>=17,<24",
    # Database / migration / ingestion stack (migrated from grievance)
    # [asyncio] pulls greenlet, required by the async engine (not auto-installed
    # on macOS arm64).
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",          # engine-portable schema migrations for the OLTP store
    "aiosqlite>=0.21.0",      # async sqlite driver (local OLTP)
    "asyncpg>=0.30",          # async postgres driver (deploy OLTP)
    "psycopg2-binary>=2.9",   # sync postgres driver for alembic
    "pymysql>=1.1.1",
    "duckdb>=1.4.3",
    "boto3>=1.34",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "more-itertools>=10.7.0",
    "pytz>=2024.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "tqdm>=4.66",
    # Experiment tracking / model registry
    "mlflow>=2.18",
]

# Heavy per-stage ML dependencies for the document processing pipeline live in
# optional groups (extras) because DeepSeek OCR needs an older `transformers`
# than the rest — declared mutually exclusive via [tool.uv].conflicts below.
# Stages import lazily (see pipeline/pipeline.py), so an environment only
# installs the extra(s) for the stages it runs. Pins follow the DSI repo
# (numpy<2, opencv<4.12, transformers>=4.57,<5) and the DeepSeek-OCR model
# card (transformers 4.46 / tokenizers 0.20).
[project.optional-dependencies]
# format_classifier, pytesseract OCR, pii_tagger, page_type, summarizer
pipeline-core = [
    "huggingface-hub",
    "langdetect",
    "nltk",
    "numpy<2",
    "opencv-python<4.12",
    "pandas",
    "pdf2image",
    "pillow",
    "pytesseract",
    # PII redaction (Presidio-based stage; replaced the lost DSI CRF)
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-image",
    "scikit-learn>=1.8,<1.9",  # match the era of the pickled estimators (page_split pkl, label encoder)
    "torch",
    "transformers>=4.57,<5",
    "xgboost",
]
# DeepSeek OCR backend — GPU-only, conflicting transformers version
ocr-deepseek = [
    "addict",
    "easydict",
    "einops",
    "pdf2image",
    "pillow",
    "torch",
    "tokenizers==0.20.3",
    # DeepSeek-OCR's trust_remote_code model code imports torchvision
    # unconditionally (found by the first GPU smoke run).
    "torchvision",
    "transformers==4.46.3",
]
# Demo API (Phase 10) — light, conflicts with nothing; the skeleton's mocked
# processor keeps it model-free until the Phase 8/9 wire-up
serving = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # multipart form parsing for POST /grievance
]
# MuRIL grievance categorizer
categorizer = [
    "huggingface-hub",
    "langdetect",
    "pandas",
    "scikit-learn>=1.8,<1.9",  # match the era of the pickled estimators (page_split pkl, label encoder)
    "torch",
    "transformers>=4.57,<5",
]
# One warm process for the live demo: the frozen serving API + every in-process
# pipeline model. Conflict-free by construction (only `ocr-deepseek` clashes
# with pipeline-core/categorizer, and it is deliberately excluded — DeepSeek OCR
# runs out-of-process on the GPU box). Launch with:
#   uv run --extra demo janasunani-api-live
#
# Torch resolves from the CPU-only index for this extra alone — see
# [tool.uv.sources] below. The always-on box has no GPU.
demo = [
    "janasunani[serving]",
    "janasunani[pipeline-core]",
    "janasunani[categorizer]",
    # Listed directly, not just inherited, because uv binds a source's
    # `extra = "demo"` marker only to packages declared on that extra.
    # Pinned to the version already locked: this change is about *where* torch
    # comes from, not which torch. Without the pin, adding the direct
    # requirement re-resolves and drags torch 2.12.1 -> 2.13.0 and torchvision
    # 0.27.1 -> 0.28.0 into the GPU path, which nothing here tests.
    "torch==2.12.1",
]

[project.scripts]
janasunani-migrate-mysql = "janasunani.migration.from_mysql:main"
janasunani-migrate-dump = "janasunani.migration.from_sql_dump:main"
janasunani-materialize = "janasunani.olap.materialize:main"
janasunani-closure-finding = "janasunani.analytics.findings.closure:main"
janasunani-ingest-documents = "janasunani.ingestion.document_ingestion:main"
janasunani-pipeline = "janasunani.pipeline.cli:main"
janasunani-export-pipeline = "janasunani.pipeline.export:main"
janasunani-evaluate-pii = "janasunani.pipeline.pii_eval:main"
janasunani-redact-grievance = "janasunani.pipeline.redact_grievance:main"
janasunani-build-crosswalk = "janasunani.routing.crosswalk:main"
janasunani-dedup-index = "janasunani.pipeline.dedup_index:main"
janasunani-api = "janasunani.serving.api:main"
janasunani-api-live = "janasunani.inference.serve:main"
janasunani-demo-preflight = "janasunani.inference.serve:preflight_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the spaCy model wheel (en-core-web-sm) is a direct GitHub URL — not on PyPI
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["janasunani"]

[tool.uv]
# DeepSeek OCR pins an older transformers than every other stage; the extras
# can never be installed into the same environment. uv resolves them into
# disjoint lock forks; one Docker image per extra on deploy.
conflicts = [
    [{ extra = "ocr-deepseek" }, { extra = "pipeline-core" }],
    [{ extra = "ocr-deepseek" }, { extra = "categorizer" }],
    # `demo` bundles pipeline-core + categorizer (transformers>=4.57), so it
    # inherits their clash with DeepSeek's transformers==4.46.3 pin.
    [{ extra = "ocr-deepseek" }, { extra = "demo" }],
]

# PyTorch's CPU-only wheel index. `explicit = true` means nothing resolves from
# here unless [tool.uv.sources] sends it — every other package still comes from
# PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
dpic = { git = "ssh://git@github.com/Data-Policy-and-Innovation-Centre/dpic-org.git", rev = "main" }
# CPU torch for the `demo` extra ONLY — the extra `deploy/api.Dockerfile`
# builds. The always-on box is CPU-only and DeepSeek is deliberately excluded
# from `demo`, so the CUDA runtime it was shipping (the linux x86_64 torch wheel
# is 532 MB before the nvidia-* and cuda-toolkit deps) was pure weight on a
# machine that also hosts the production Postgres.
#
# Deliberately NOT applied to `categorizer` or `pipeline-core`: the MuRIL
# embedding pass is a corpus-scale GPU batch job on the GPU box (ROADMAP §5.3
# S4), and `ocr-deepseek` is GPU-only by nature. Pinning those to CPU wheels
# would quietly remove GPU acceleration from the backfills.
torch = [{ index = "pytorch-cpu", extra = "demo" }]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "moto[s3]>=5.0",
    "nbstripout>=0.9.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
