name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-validate-pipeline:
    runs-on: ubuntu-latest
    env:
      DPIC_GITHUB_SSH_KEY: ${{ secrets.DPIC_GITHUB_SSH_KEY }}
    services:
      # Throwaway Postgres so the Postgres-path tests (test_oltp_swap.py) run
      # instead of skipping. Port/credentials match the tests' default
      # TEST_OLTP_PG_URL (postgres:pass @ 127.0.0.1:5433/janasunani).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: janasunani
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Configure SSH for private dependencies
        if: ${{ env.DPIC_GITHUB_SSH_KEY != '' }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DPIC_GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # --extra serving: light (fastapi/uvicorn/multipart), conflicts with
      # nothing, and lets the API contract tests run instead of skipping.
      # The heavy ML extras stay out of CI (models + GPU live elsewhere).
      - name: Sync dependencies
        run: uv sync --all-groups --extra serving

      - name: Run tests with coverage
        run: uv run pytest --cov=janasunani --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Write coverage markdown
        if: github.event_name == 'pull_request'
        run: uv run coverage report -m --skip-covered --format=markdown > coverage.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- janasunani-coverage-report -->";
            const report = fs.readFileSync("coverage.md", "utf8");
            const body = `${marker}
            ## Test Coverage

            ${report}

            Full XML report is available as the \`coverage-xml\` workflow artifact.`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find(
              (comment) =>
                comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      # Validate the pipeline DEFINITION only — do not execute data stages in CI.
      # `materialize` needs the operational OLTP DB (SQLite dev file or the box's
      # Postgres), and the cold-start migration needs the 3.2 GB DVC-tracked dump
      # plus Docker + MySQL. These produce data and run on the operational box /
      # a scheduled job, never on a clean CI runner.
      - name: Validate DVC pipeline definition
        run: |
          uv run dvc dag
          uv run dvc dag --md >> "$GITHUB_STEP_SUMMARY" || true
