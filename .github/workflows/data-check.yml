name: Data Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  no-raw-data-in-git:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject directly committed data and outputs
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(
            git ls-files 'data/**' 'outputs/**' |
              grep -Ev '(^|/)\.gitkeep$|\.dvc$|^data/external/[^/]+\.provenance\.json$' || true
          )"

          if [ -n "$bad_files" ]; then
            echo "The following data/output files are tracked directly by Git:"
            echo "$bad_files"
            echo ""
            echo "Use DVC for approved data or keep stakeholder-facing artifacts in Box."
            exit 1
          fi

      # Provenance sidecars are the one exception above: they record versions,
      # checksums and span counts so a gold artifact can be reviewed without
      # pulling it. The exception is granted by filename, so the contents have
      # to be checked against the metadata contract. The rules, and why they
      # are an allowlist rather than a denylist, live in the script.
      - name: Check provenance sidecars carry metadata only
        shell: bash
        run: |
          set -euo pipefail

          sidecars="$(git ls-files 'data/external/*.provenance.json' || true)"
          [ -n "$sidecars" ] || exit 0

          # Word-split intentionally: git ls-files gives one path per line.
          # shellcheck disable=SC2086
          python3 scripts/check_provenance_sidecars.py $sidecars

      - name: Reject local state and secret files
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(
            git ls-files |
              grep -E '(^|/)(terraform\.tfstate(\..*)?|terraform\.tfvars|.*\.auto\.tfvars|\.env|.*\.pem|id_rsa|id_ed25519)$' |
              grep -Ev '(^|/)\.env\.example$|(^|/)terraform\.tfvars\.example$' || true
          )"

          if [ -n "$bad_files" ]; then
            echo "The following local state/secret files are tracked directly by Git:"
            echo "$bad_files"
            echo ""
            echo "Keep Terraform state, tfvars, env files, and private keys local."
            exit 1
          fi

      - name: Check DVC files are present
        shell: bash
        run: |
          test -f .dvc/config
          test -f dvc.yaml

      - name: Check DVC lock is updated when deps change
        shell: bash
        run: |
          set -euo pipefail
          # Cheap check that would have caught f890120: if a commit touches a
          # stage's declared deps (dvc.yaml) without updating dvc.lock, the
          # artifact in the DVC remote goes stale silently. dvc status cannot
          # do this without the data, so we compare changed paths against the
          # deps list in dvc.yaml.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
            # Fallback when base sha is empty (local act)
            if [ -z "$base" ]; then
              base="origin/main"
            fi
          else
            base="HEAD~1"
            head="HEAD"
          fi
          python3 scripts/check_dvc_lock.py --base "$base" --head "$head" 
