<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450">
  <!--
    Janasunani 2.0 architecture, slide 3.

    Style is taken from the GAPG 18 August reference deck: flat fills, hairline
    rules, maroon as a sparse accent, greys carrying structure. No gradients,
    no shadows, no icons.

      7A1F2B  maroon accent      1E1F24  box titles
      44464D  body               6C6E76  annotations and arrows
      F2F2F2  box fill           DDDDDD  hairlines

    Fonts list the genuine faces first so PowerPoint resolves Calibri and
    Cambria, with Carlito and Caladea as metric-compatible fallbacks for
    renderers that lack them (this machine included).
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C6E76"/>
    </marker>
    <style>
      .lane   { font-family: Calibri, Carlito, sans-serif; font-size: 15px; font-weight: 700;
                fill: #7A1F2B; letter-spacing: 1.6px; }
      .title  { font-family: Cambria, Caladea, serif; font-size: 17px; font-weight: 700; fill: #1E1F24; }
      .body   { font-family: Calibri, Carlito, sans-serif; font-size: 14px; fill: #44464D; }
      .note   { font-family: Calibri, Carlito, sans-serif; font-size: 13px; font-style: italic; fill: #6C6E76; }
      .box    { fill: #F2F2F2; stroke: #DDDDDD; stroke-width: 1; }
      .store  { fill: #FFFFFF; stroke: #DDDDDD; stroke-width: 1; }
      .flow   { stroke: #6C6E76; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- lane divider -->
  <line x1="505" y1="8" x2="505" y2="290" stroke="#DDDDDD" stroke-width="1"/>

  <!-- ─────────────── lane headings ─────────────── -->
  <text class="lane" x="40"  y="18">LIVE · ONE GRIEVANCE, SECONDS</text>
  <text class="lane" x="540" y="18">BATCH · ALL OF THEM AT ONCE</text>

  <!-- ─────────────── live lane ─────────────── -->
  <rect class="box" x="40" y="38" width="430" height="44"/>
  <text class="title" x="60" y="66">A citizen files one grievance</text>

  <path class="flow" d="M 255 82 L 255 104" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="106" width="430" height="76"/>
  <text class="title" x="60" y="134">Processed on its own</text>
  <text class="body"  x="60" y="157">read · hide personal details · flag</text>
  <text class="body"  x="60" y="175">sort · summarise · suggest a department</text>

  <!-- live drop to the shared bus -->
  <path class="flow" d="M 255 182 L 255 306"/>

  <!-- ─────────────── batch lane ─────────────── -->
  <rect class="box" x="540" y="38" width="700" height="44"/>
  <text class="title" x="560" y="66">1.37 million past records</text>

  <path class="flow" d="M 890 82 L 890 104" marker-end="url(#arrow)"/>

  <rect class="box" x="540" y="106" width="700" height="76"/>
  <text class="title" x="560" y="134">The same steps, in bulk</text>
  <text class="body"  x="560" y="157">read · hide personal details · sort · summarise</text>
  <text class="body"  x="560" y="175">the same models the live path uses</text>

  <path class="flow" d="M 890 182 L 890 204" marker-end="url(#arrow)"/>

  <rect class="box" x="540" y="206" width="700" height="76"/>
  <text class="title" x="560" y="234">Deduplication: every record against every other</text>
  <text class="body"  x="560" y="257">duplicate filings · campaigns</text>
  <text class="body"  x="560" y="275">recurring themes · sudden surges</text>

  <!-- batch drop to the shared bus -->
  <path class="flow" d="M 890 282 L 890 306"/>

  <!-- ─────────────── convergence ─────────────── -->
  <path class="flow" d="M 255 306 L 890 306"/>
  <path class="flow" d="M 573 306 L 573 322" marker-end="url(#arrow)"/>

  <!-- ─────────────── shared storage ─────────────── -->
  <rect class="store" x="383" y="324" width="380" height="44"/>
  <rect x="383" y="324" width="5" height="44" fill="#7A1F2B"/>
  <text class="title" x="405" y="352">The case record</text>
  <text class="note"  x="783" y="352">officers see this straight away</text>

  <path class="flow" d="M 573 368 L 573 390" marker-end="url(#arrow)"/>

  <rect class="store" x="383" y="392" width="380" height="44"/>
  <rect x="383" y="392" width="5" height="44" fill="#7A1F2B"/>
  <text class="title" x="405" y="420">The analysis copy</text>
  <text class="note"  x="783" y="414">rebuilt in about 26 seconds</text>
  <text class="note"  x="783" y="432">every report reads this, not the record</text>
</svg>
